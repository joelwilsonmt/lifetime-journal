# Settings come from .env next to this file (see .env.example).
#   Pull the published image:  docker compose pull && docker compose up -d
#   Build from source instead: docker compose up -d --build
#   Load a tarball:            gunzip -c lifetime-calendar-*.tar.gz | docker load && docker compose up -d
services:
  lifetime-calendar:
    image: ${IMAGE:-ghcr.io/joelwilsonmt/lifetime-calendar}:${VERSION:-latest}
    build:
      context: .
      args:
        VERSION: ${VERSION:-latest}
    container_name: lifetime-calendar
    restart: unless-stopped
    # Run as the owner of ./data so files stay readable on the host
    # (restic, Obsidian, you).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # Tailnet only: bind to 127.0.0.1 behind `tailscale serve`, or to the
    # server's Tailscale IP. Never 0.0.0.0, and never through a public tunnel.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3075}:3000"
    volumes:
      - ./data:/data
    environment:
      TRASH_DAYS: ${TRASH_DAYS:-30}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
