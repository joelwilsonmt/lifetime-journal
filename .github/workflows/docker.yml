name: Docker image

# Pushes to main publish :latest and :sha-<commit>; tags like v1.2.3 publish
# :1.2.3 and :1.2. Pull requests build and smoke-test without publishing.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr

      # Build the amd64 variant into the local daemon and make sure it runs
      # before anything is published.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lifetime-journal:ci
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          mkdir -p data
          sudo chown 1000:1000 data
          docker run -d --name lc -p 3075:3000 -v "$PWD/data:/data" \
            --read-only --tmpfs /tmp --security-opt no-new-privileges:true \
            lifetime-journal:ci
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' lc)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs lc
          [ "$status" = healthy ] || { echo "Container not healthy: $status"; exit 1; }
          curl -fsS http://127.0.0.1:3075/api/health
          curl -fsS http://127.0.0.1:3075/ | grep -q '<div id="root">'
          curl -fsS -X PUT -H 'content-type: application/json' \
            -d '{"note":"ci smoke","activities":["Read"]}' \
            http://127.0.0.1:3075/api/days/2026-01-01
          sudo test -f data/journal/2026/01/2026-01-01.md

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
